<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ece0c8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1712" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta property="og:title" content="MTG Win Stats" />
  <meta property="og:description" content="MTG Win Stats" />
  <meta property="og:image" content="https://mtg-win-stats.vercel.app/og-image.png" />
  <meta property="og:url" content="https://mtg-win-stats.vercel.app/" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MTG Win Stats" />
  <meta name="twitter:description" content="MTG Win Stats" />
  <meta name="twitter:image" content="https://mtg-win-stats.vercel.app/og-image.png" />

  <script>
    // Avoid dark-mode flash on first paint
    try {
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Baloo+2:wght@500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />

  <title>MTG Win Stats</title>

  <!-- The reset and the body font live in src/styles/theme.css, which owns
       them outright; duplicating them here contradicted that file's own
       body rule. -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
