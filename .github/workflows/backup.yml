name: Backup

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export tables
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          mkdir -p backups
          for table in decks games game_participants; do
            curl -sf "$SUPABASE_URL/rest/v1/$table?select=*" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -o "backups/${table}-$(date +%F).json"
          done

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily backup $(date +%F)"
          file_pattern: backups/*.json
